#
#  >>> EVERY MEMBER MUST EDIT db.password BELOW ON THEIR OWN LAPTOP. <<<
#
#  This file IS committed to git, with a placeholder password, so that nobody
#  has to guess the settings. That is a deliberate trade-off for a coursework
#  project. In a real deployment these values would come from environment
#  variables or a JNDI DataSource, never from a file in the repository -
#  worth one sentence in the report's limitations section.
#
#  If you change your password here, do NOT commit it:
#      git update-index --skip-worktree src/main/resources/db.properties
#  (undo later with --no-skip-worktree)
#
# ============================================================================

# --- Driver -----------------------------------------------------------------
# MySQL Connector/J 8.x. The older "com.mysql.jdbc.Driver" is for version 5.x
# and will throw ClassNotFoundException with the connector in this project.
db.driver=com.mysql.cj.jdbc.Driver

# --- Connection URL ---------------------------------------------------------
# The parameters after the ? are not optional decoration - each one prevents a
# specific error that MySQL 8 throws by default:
#
#   useSSL=false                  -> silences the "SSL not established" warning
#                                    on a local dev database
#   allowPublicKeyRetrieval=true  -> prevents "Public Key Retrieval is not
#                                    allowed" with caching_sha2_password auth
#   serverTimezone=...            -> prevents "The server time zone value
#                                    '+08' is unrecognized"
#   useUnicode / characterEncoding-> so medicine names with accents survive
#
db.url=jdbc:mysql://localhost:3306/pharmatrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur&useUnicode=true&characterEncoding=UTF-8

# --- Credentials ------------------------------------------------------------
# CHANGE db.password TO YOUR OWN MySQL ROOT PASSWORD.
db.username=root
db.password=CHANGE_ME

# --- Notes ------------------------------------------------------------------
# Port not 3306? Change it in db.url above. Check the actual port in
# MySQL Workbench under Server > Server Status.
